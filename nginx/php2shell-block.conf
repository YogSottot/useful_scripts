map $http_user_agent $block_ua {
    default 0;

    # --- Уязвимости и сканеры (PHP2Shell, Nikto, sqlmap и т.д.) ---
    "~*php2shell" 1;
    "~*nikto" 1;
    "~*sqlmap" 1;
    "~*nmap" 1;
    "~*masscan" 1;
    "~*acunetix" 1;
    "~*netsparker" 1;
    "~*openvas" 1;
    "~*nessus" 1;
    "~*w3af" 1;
    "~*zmeu" 1;
    "~*nuclei" 1;
    "~*wpscan" 1;
    "~*burpsuite" 1;
    "~*zap" 1;
    "~*havij" 1;
    "~*whatweb" 1;
    "~*commix" 1;

    # --- Брутфорс и фаззинг (DirBuster, Gobuster, ffuf, Hydra) ---
    "~*dirbuster" 1;
    "~*gobuster" 1;
    "~*feroxbuster" 1;
    "~*ffuf" 1;
    "~*wfuzz" 1;
    "~*hydra" 1;
    "~*zgrab" 1;
    "~*recon-ng" 1;

    # --- Стандартные HTTP-клиенты (часто используются в автоматизации) ---
    "~*python-requests" 1;
    "~*python-urllib" 1;
#curl и wget могут использовать, лучше не включать    "~*go-http-client" 1;
#    "~*libwww-perl" 1;
#    "~*java/" 1;

    # --- Известные агрессивные скраперы ---
    "~*httrack" 1;
    "~*sitesucker" 1;
    "~*scrapy" 1;
    "~*semrushbot" 1;
    "~*ahrefsbot" 1;
    "~*mj12bot" 1;
}

map $request_uri $block_path {
    default 0;
    # Пути, которые перебирал сканер
    "~*^/(vuln|info|php_info|pi|p|page|main|home|api|view|content|article|download|show|load|lang|modules)\.php" 1;
    "~*^/admin/index\.php" 1;
    # Попытки использования php://filter и чтения /etc/passwd
    "~*php://filter" 1;
    "~*%2Fetc%2Fpasswd" 1;
    "~*etc/passwd" 1;
    # Можно добавить любые другие пути из логов
}
