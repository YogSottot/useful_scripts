geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    auto_reload 5m;
    $country_code country iso_code;
}

# Разрешённые страны
map $country_code $country_allowed {
    default 0;
    RU 1;
    BY 1;
    KZ 1;
}

# Доверенные IP роботов
geo $bot_allowed {
    default 0;
    include /etc/nginx/googlebot-ips.conf;
    include /etc/nginx/yandex-ips.conf;
}

# Исключение для Let's Encrypt ACME HTTP-01
map $uri $acme_challenge {
    default 0;
    ~^/\.well-known/acme-challenge/ 1;
}

# Итоговое решение: блокировать или нет
map "$country_allowed:$bot_allowed:$acme_challenge" $geo_block {
    default 0;
    # default 1;
    #~^1:     0;  # Разрешённая страна
    #~^0:1:   0;  # Поисковый робот
    #"0:0:1"  0;  # ACME challenge
    "0:0:0" 1;
}
